services:
  - type: web
    name: seo-analytics-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
